name: develop

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Frappe develop — Python 3.12
    runs-on: ubuntu-22.04
    continue-on-error: true

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=2s
          --health-retries=3

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Start MariaDB
        run: |
          docker run -d --name mariadb -p 3306:3306 \
            -e MYSQL_ROOT_PASSWORD=root \
            -e MYSQL_DATABASE=test_site \
            mariadb:10.6 \
            --character-set-server=utf8mb4 \
            --collation-server=utf8mb4_unicode_ci \
            --transaction-isolation=READ-COMMITTED \
            --skip-character-set-client-handshake
          until docker exec mariadb mariadb-admin -uroot -proot ping; do
            echo "Waiting for MariaDB..."
            sleep 2
          done

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libffi-dev liblcms2-dev libldap2-dev \
            libmariadb-dev libsasl2-dev libtiff5-dev libwebp-dev redis-tools \
            software-properties-common tk-dev wkhtmltopdf zlib1g-dev \
            curl nodejs npm
          sudo npm install -g yarn

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-develop-${{ hashFiles('pyproject.toml') }}

      - name: Install bench
        run: |
          python -m pip install --upgrade pip
          python -m pip install frappe-bench

      - name: Init bench (develop)
        run: |
          bench init \
            --frappe-branch develop \
            --skip-redis-config-generation \
            --python python3.12 \
            frappe-bench

      - name: Install app
        working-directory: frappe-bench
        run: |
          bench get-app reversible_import ${{ github.workspace }}

      - name: Install test dependencies
        working-directory: frappe-bench
        run: ./env/bin/pip install pytest pytest-xdist

      - name: Create site
        working-directory: frappe-bench
        run: |
          bench new-site test_site \
            --mariadb-root-password root \
            --admin-password admin \
            --db-host 127.0.0.1

      - name: Install app on site
        working-directory: frappe-bench
        run: bench --site test_site install-app reversible_import

      - name: Run tests
        working-directory: frappe-bench
        run: bench --site test_site run-tests --app reversible_import
