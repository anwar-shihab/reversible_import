[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "reversible_import"
authors = [{name = "Anwar Shihab", email = "anwarshihab0@gmail.com"}]
description = "Reversible, auditable and resumable data imports for Frappe"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
license = {text = "MIT"}
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Framework :: Frappe",
]

[project.optional-dependencies]
test = ["pytest>=7.0", "pytest-xdist>=2.5"]

[project.urls]
Homepage = "https://github.com/anwar-shihab/reversible_import"
Repository = "https://github.com/anwar-shihab/reversible_import"

[tool.flit.module]
name = "reversible_import"

[tool.pytest.ini_options]
testpaths = ["reversible_import/reversible_import/tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
